<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Warm Amber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Vision Aperture Ring (እይታ - Vision Lens) with zero background box -->
  <!-- Top/Left Amber Arc -->
  <path
    d="M256 468C138.917 468 44 373.083 44 256C44 138.917 138.917 44 256 44"
    stroke="url(#goldGrad)"
    stroke-width="38"
    stroke-linecap="round"
  />

  <!-- Bottom/Right Cyan Arc -->
  <path
    d="M256 44C373.083 44 468 138.917 468 256C468 373.083 373.083 468 256 468"
    stroke="url(#cyanGrad)"
    stroke-width="38"
    stroke-linecap="round"
  />

  <!-- Optical Iris Shutter Blades -->
  <g opacity="0.9">
    <path d="M256 74L316 186" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M438 256L326 316" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M256 438L196 326" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M74 256L186 196" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Focus Reticle Inner Ring -->
  <circle
    cx="256"
    cy="256"
    r="132"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-opacity="0.25"
    stroke-dasharray="14 14"
  />

  <!-- Central 3D Faceted Play Prism -->
  <g filter="url(#softGlow)">
    <!-- Crisp White Base Triangle -->
    <path
      d="M216 170L360 256L216 342V170Z"
      fill="#FFFFFF"
    />
    <!-- Upper Amber Gold Facet -->
    <path
      d="M216 170L360 256L216 256V170Z"
      fill="url(#goldGrad)"
      opacity="0.9"
    />
    <!-- Lower Electric Cyan Facet -->
    <path
      d="M216 256L360 256L216 342V256Z"
      fill="url(#cyanGrad)"
      opacity="0.9"
    />
  </g>
</svg>
