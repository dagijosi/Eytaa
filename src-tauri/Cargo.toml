[package]
name = "eytaa"
version = "0.2.8"
description = "EYTAA - Every story, in view. Modern Windows Desktop Media Player powered by Tauri 2 and libmpv"
authors = ["Dagmawi Y"]
edition = "2021"

[lib]
name = "eytaa_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
notify = { version = "8.2.0", features = ["mio", "kqueue", "macos_kqueue", "macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
