<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EYTAA</title>
    <style>
      /* Startup splash: painted instantly so the window is never blank while the app boots. */
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        background-image: radial-gradient(
          circle at 50% 42%,
          rgba(245, 158, 11, 0.14),
          rgba(9, 9, 11, 0) 60%
        );
        opacity: 1;
        transition: opacity 320ms ease;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #startup-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #startup-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #startup-splash .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.45));
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #startup-splash .splash-title {
        color: #ffffff;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.38em;
        text-indent: 0.38em;
      }
      #startup-splash .splash-spinner {
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-top-color: #f59e0b;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="startup-splash" aria-hidden="true">
      <div class="splash-inner">
        <img class="splash-logo" src="/app-icon.png" alt="" />
        <div class="splash-title">EYTAA</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
