name: Release EYTAA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      keep_releases:
        description: "Number of latest releases to retain"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup libmpv native binaries
        run: npm run setup:lib

      - name: Build and Publish Release to GitHub
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "EYTAA ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: "See the assets below to download the latest EYTAA release for Windows."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Clean up old releases to save storage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_releases || 3 }}', 10) || 3;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 50
            });
            console.log(`Found ${releases.length} total release(s). Keeping the latest ${keepCount}.`);
            if (releases.length > keepCount) {
              const toDelete = releases.slice(keepCount);
              for (const rel of toDelete) {
                console.log(`Deleting old release: ${rel.tag_name} (ID: ${rel.id}) and all its assets`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: rel.id
                });
                try {
                  console.log(`Deleting tag: ${rel.tag_name}`);
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${rel.tag_name}`
                  });
                } catch (err) {
                  console.log(`Notice: Tag ${rel.tag_name} could not be deleted or already removed: ${err.message}`);
                }
              }
            }
