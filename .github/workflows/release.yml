name: Release EYTAA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      keep_releases:
        description: "Number of latest releases to retain"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup libmpv native binaries
        run: npm run setup:lib

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name || github.event.inputs.tag }}';
            const cleanVersion = tag.replace(/^v/, '');
            const { owner, repo } = context.repo;
            const fs = require('fs');

            let notes = '';

            // 1. Try extracting notes from CHANGELOG.md for this version
            if (fs.existsSync('CHANGELOG.md')) {
              try {
                const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
                const escapedVer = cleanVersion.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`##\\s*\\[?${escapedVer}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i');
                const match = changelog.match(regex);
                if (match && match[1].trim()) {
                  notes = match[1].trim();
                  console.log(`Successfully extracted changelog notes for ${cleanVersion}`);
                }
              } catch (e) {
                console.warn('Error reading CHANGELOG.md:', e);
              }
            }

            // 2. Fallback to GitHub generateReleaseNotes API if CHANGELOG section not found
            if (!notes) {
              try {
                const res = await github.rest.repos.generateReleaseNotes({
                  owner,
                  repo,
                  tag_name: tag,
                });
                notes = res.data.body || '';
                console.log(`Generated release notes via GitHub API for ${tag}`);
              } catch (e) {
                console.warn('GitHub generateReleaseNotes API failed:', e.message);
              }
            }

            if (!notes) {
              notes = `Release ${tag}\n\nSee commits for details.`;
            }

            fs.writeFileSync('RELEASE_NOTES.txt', notes, 'utf8');
            core.setOutput('notes', notes);

      - name: Build and Publish Release to GitHub
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "EYTAA ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Sync Full Release Notes to GitHub Release
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ github.ref_name || github.event.inputs.tag }}';
            const { owner, repo } = context.repo;
            const fs = require('fs');

            if (!fs.existsSync('RELEASE_NOTES.txt')) return;
            const notes = fs.readFileSync('RELEASE_NOTES.txt', 'utf8').trim();
            if (!notes) return;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              if (release && release.data && release.data.id) {
                console.log(`Updating release ${tag} (ID: ${release.data.id}) with full changelog notes...`);
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.data.id,
                  body: notes,
                });
                console.log('GitHub Release description synchronized successfully!');
              }
            } catch (err) {
              console.warn(`Could not sync release notes via API: ${err.message}`);
            }

  build-macos:
    permissions:
      contents: write
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup libmpv wrapper
        run: npm run setup:lib

      - name: Install macOS native dependencies
        run: brew install mpv ffmpeg dylibbundler

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name || github.event.inputs.tag }}';
            const cleanVersion = tag.replace(/^v/, '');
            const { owner, repo } = context.repo;
            const fs = require('fs');

            let notes = '';

            if (fs.existsSync('CHANGELOG.md')) {
              try {
                const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
                const escapedVer = cleanVersion.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`##\\s*\\[?${escapedVer}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i');
                const match = changelog.match(regex);
                if (match && match[1].trim()) {
                  notes = match[1].trim();
                  console.log(`Successfully extracted changelog notes for ${cleanVersion}`);
                }
              } catch (e) {
                console.warn('Error reading CHANGELOG.md:', e);
              }
            }

            if (!notes) {
              try {
                const res = await github.rest.repos.generateReleaseNotes({
                  owner,
                  repo,
                  tag_name: tag,
                });
                notes = res.data.body || '';
                console.log(`Generated release notes via GitHub API for ${tag}`);
              } catch (e) {
                console.warn('GitHub generateReleaseNotes API failed:', e.message);
              }
            }

            if (!notes) {
              notes = `Release ${tag}\n\nSee commits for details.`;
            }

            fs.writeFileSync('RELEASE_NOTES.txt', notes, 'utf8');
            core.setOutput('notes', notes);

      - name: Build and Publish macOS Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--target aarch64-apple-darwin"
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "EYTAA ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  cleanup-releases:
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Clean up old releases to save storage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_releases || 3 }}', 10) || 3;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 50
            });
            console.log(`Found ${releases.length} total release(s). Keeping the latest ${keepCount}.`);
            if (releases.length > keepCount) {
              const toDelete = releases.slice(keepCount);
              for (const rel of toDelete) {
                console.log(`Deleting old release: ${rel.tag_name} (ID: ${rel.id}) and all its assets`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: rel.id
                });
                try {
                  console.log(`Deleting tag: ${rel.tag_name}`);
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${rel.tag_name}`
                  });
                } catch (err) {
                  console.log(`Notice: Tag ${rel.tag_name} could not be deleted or already removed: ${err.message}`);
                }
              }
            }
